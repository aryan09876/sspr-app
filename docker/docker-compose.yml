services:
  sspr-test:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file: .env.docker
    ports:
      - "3001:3000"   # Port 3001 sur l'hôte pour ne pas conflictuer avec la prod (3000)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
